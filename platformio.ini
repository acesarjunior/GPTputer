[platformio]
default_envs = cardputer_adv

[env:cardputer_adv]
; Cardputer-ADV target follows M5Stack's documented PlatformIO board target.
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

; ADV = ESP32-S3FN8 / 8MB QIO.
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv

lib_deps =
    m5stack/M5Cardputer @ 1.1.1
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; Prevent LTO/linker incompatibilities seen with some cached toolchains.
build_unflags =
    -flto
